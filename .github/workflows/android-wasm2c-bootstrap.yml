name: Android wasm2c host toolchain

on:
  push:
    branches:
      - android-mods-adaptation
    paths:
      - "app/Scripts/prepare_android_wasm2c.py"
      - "app/Scripts/patch_wasm2c.py"
      - "app/Scripts/test_android_futex_compile.py"
      - "app/Scripts/test_android_posix_apis.py"
      - "app/Tests/android_posix_api_probe.c"
      - "app/Source/WasmFutex.c"
      - "app/Source/NativeThreads.c"
      - "app/Source/EngineHost.c"
      - ".github/workflows/android-wasm2c-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-wasm2c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 zlib1g-dev libbz2-dev libssl-dev

      - name: Locate preinstalled Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$NDK" && test -d "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using Android NDK: $NDK"

      - name: Build pinned custom WABT wasm2c host tool
        run: |
          python3 app/Scripts/prepare_android_wasm2c.py --toolchain-only

      - name: Verify generated host tool
        run: |
          test -x app/Tools/wasm2c-native
          app/Tools/wasm2c-native --help

      - name: Validate Android engine preparation scripts
        run: |
          python3 -m py_compile app/Scripts/prepare_android_wasm2c.py app/Scripts/prepare_android_engine.py app/Scripts/test_android_futex_compile.py app/Scripts/test_android_posix_apis.py
          python3 app/Scripts/test_android_futex_compile.py
          python3 app/Scripts/test_android_posix_apis.py
          python3 - <<'PY'
          from pathlib import Path
          import ast
          source = Path("app/Scripts/prepare_android_engine.py").read_text()
          tree = ast.parse(source)
          stages = next(node.value for node in ast.walk(tree)
                        if isinstance(node, ast.Assign)
                        and any(isinstance(t, ast.Name) and t.id == "PATCH_STAGES" for t in node.targets))
          names = [item.value.split(":")[0] for item in stages.elts]
          missing = [name for name in names if not (Path("app/Scripts") / name).is_file()]
          if missing:
              raise SystemExit("Missing preparation stages: " + ", ".join(missing))
          print(f"Validated {len(names)} ordered engine patch stages.")
          PY
