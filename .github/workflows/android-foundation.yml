name: Android foundation build

on:
  push:
    branches: [android-port-foundation]
    paths:
      - 'android/**'
      - 'app/Source/**'
      - 'app/Scripts/**'
      - '.github/workflows/android-foundation.yml'
  pull_request:
    branches: [android-port-foundation]
    paths:
      - 'android/**'
      - '.github/workflows/android-foundation.yml'
  workflow_dispatch:

concurrency:
  group: android-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cli.zip"
          mkdir -p "$RUNNER_TEMP/android-cli"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null

      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Test generated WABT Android diagnostics patch
        run: python3 app/Scripts/test_android_engine_pipeline.py

      - name: Install Naga WGSL to SPIR-V compiler
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install naga-cli --locked

      - name: Test Android shader and GPU protocol preparation
        run: |
          python3 app/Scripts/test_android_shader_compiler.py
          python3 app/Scripts/test_android_shaders.py
          python3 app/Scripts/test_android_shaders.py
          python3 app/Scripts/test_android_gpu_protocol.py
          mkdir -p "$RUNNER_TEMP/pgandroid-gpu"
          python3 app/Scripts/prepare_android_gpu_protocol.py \
            --renderer app/Source/MetalRenderer/MRRenderer.mm \
            --internal-header app/Source/MetalRenderer/MRInternal.h \
            --json "$RUNNER_TEMP/pgandroid-gpu/protocol.json" \
            --header "$RUNNER_TEMP/pgandroid-gpu/PGAndroidGpuProtocol.h"
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            -I "$RUNNER_TEMP/pgandroid-gpu" \
            android/app/src/main/cpp/gpu_command_ring.cpp \
            android/app/src/main/cpp/tests/gpu_command_ring_test.cpp \
            -o "$RUNNER_TEMP/pgandroid-gpu/ring-test"
          "$RUNNER_TEMP/pgandroid-gpu/ring-test"

      - name: Test Android shader binding packets
        run: python3 app/Scripts/test_android_gpu_bindings.py
          python3 app/Scripts/test_android_gpu_packets.py

      - name: Test Android BC texture decoder
        run: |
          mkdir -p "$RUNNER_TEMP/pgandroid-bc"
          python3 app/Scripts/prepare_android_bc_decoder.py --output "$RUNNER_TEMP/pgandroid-bc/bcdec.h"
          python3 app/Scripts/test_android_bc_decoder.py \
            --header "$RUNNER_TEMP/pgandroid-bc/bcdec.h" \
            --source app/Source

      - name: Build arm64 debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gta5-android-foundation-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
